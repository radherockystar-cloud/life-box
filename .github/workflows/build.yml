name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build
      env:
        # .env GitHub par nahi jaati, isliye keys GitHub Secrets se aati hain
        VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        VITE_FEEDBACK_KEY: ${{ secrets.VITE_FEEDBACK_KEY }}

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Add invite link and permissions to the Android manifest
      run: node scripts/patch-android-manifest.mjs

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Use fixed debug keystore
      env:
        KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        mkdir -p ~/.android
        echo "$KS" | base64 -d > ~/.android/debug.keystore
        ls -l ~/.android
        keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA1"

    - name: Build Android APK
      env:
        ANDROID_USER_HOME: /home/runner/.android
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Print APK signing SHA-1
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
        $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1\|Signer #1 certificate DN"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
